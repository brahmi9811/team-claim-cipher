[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-cipher"
version = "0.1.0"
description = "Self-improving claim-denial fighter with a PHI firewall"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pymongo[encryption]>=4.8",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "langsmith>=0.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local, free query/document embeddings for common/search.py's classic
# $vectorSearch path (a "bring your own embeddings" index, no Voyage/Atlas
# Automated Embeddings cost). Also what scripts/embed_policies.py uses.
embeddings = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
include = ["common*", "firewall*", "validator*", "agents*", "orchestrator*", "forge*", "sim*", "scorer*", "web*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]
